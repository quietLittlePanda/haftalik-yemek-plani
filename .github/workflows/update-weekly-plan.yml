name: Haftalık Akşam Yemeği Planını Güncelle

on:
  schedule:
    # Her Pazar 14:00 UTC = Türkiye saatiyle 17:00
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu hazırla
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Yeni haftalık planı oluştur
        run: node scripts/generate-plan.js

      - name: Yeni planı kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan.json public/plan.json

          if git diff --staged --quiet; then
            echo "Değişiklik bulunamadı."
          else
            git commit -m "Haftalık yemek planını güncelle"
            git push
          fi

      - name: Telegram bildirimi gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Haftalık akşam yemeği planı hazır: https://quietlittlepanda.github.io/haftalik-yemek-plani/"